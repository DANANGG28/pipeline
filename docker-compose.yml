services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kaldera-app
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - APP_KEY=${APP_KEY:-}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - SEED_DB=${SEED_DB:-false}
      - LOG_CHANNEL=stderr
    volumes:
      - kaldera_sqlite:/var/www/html/database
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  kaldera_sqlite:
